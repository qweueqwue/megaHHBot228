# fly.toml app configuration file generated for megahhbot228 on 2026-11-13T04:18:49Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'megahhbot228'
primary_region = 'ams'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
